<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>⭐ Mis Favoritos</title>
    <link rel="stylesheet" href="/static/css/favoritos.css">
</head>

<body>

    <!-- Header superior con título y botón estilizado de filtros -->
    <header class="page-header">
        <a href="/" class="btn-home-nav" title="Volver al inicio">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </a>
        <h1 id="page-title">⭐ Favoritos (0)</h1>
        <button id="btn-toggle-filters" class="btn-filter">
            <svg class="icon-filter" viewBox="0 0 24 24">
                <path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z" />
            </svg>
            <span>Filtros</span>
            <span id="badge-active-count" class="badge-count" style="display: none;">0</span>
        </button>
    </header>

    <!-- Layout principal dividido en Grid + Sidebar Desplegable -->
    <div class="layout-wrapper">

        <!-- Área Central Grid + Paginación -->
        <main class="content-area">
            <div id="media-grid" class="media-grid"></div>

            <div id="pagination" class="pagination-container">
                <button id="btn-prev" class="btn-nav">Anterior</button>
                <span>Página <input type="number" id="page-input" value="1" min="1"> de <span
                        id="total-pages">1</span></span>
                <button id="btn-next" class="btn-nav">Siguiente</button>
            </div>
        </main>

        <!-- Sidebar Desplegable Smooth desde la Derecha -->
        <aside id="filter-sidebar" class="filter-sidebar">
            <div class="sidebar-header">
                <h2>Filtros</h2>
                <button id="btn-close-sidebar" class="btn-close">&times;</button>
            </div>

            <div class="sidebar-content">
                <!-- Panel de Filtros Activos con Tags -->
                <div class="filter-group">
                    <label>Filtros Activos</label>
                    <div id="active-tags-container" class="tags-container">
                        <span class="no-tags-msg">Sin filtros aplicados</span>
                    </div>
                </div>

                <hr class="divider">

                <!-- Desplegable Personas -->
                <div class="filter-group">
                    <label for="select-personas">Filtrar por Persona</label>
                    <select id="select-personas" class="custom-select">
                        <option value="">Cargando personas...</option>
                    </select>
                </div>

                <!-- Desplegable Álbumes -->
                <div class="filter-group">
                    <label for="select-albumes">Filtrar por Álbum</label>
                    <select id="select-albumes" class="custom-select">
                        <option value="">Cargando álbumes...</option>
                    </select>
                </div>

                <button id="btn-clear-all" class="btn-clear-all">Limpiar todos los filtros</button>
            </div>
        </aside>

    </div>

    <!-- Modal de Confirmación para Desasociar/Quitar de Favoritos -->
    <div id="confirm-modal" class="modal-overlay">
        <div class="modal-card">
            <h3>¿Quitar de favoritos?</h3>
            <p>El archivo dejará de aparecer en este panel.</p>
            <div class="modal-actions">
                <button id="modal-btn-cancel" class="btn-sec">Cancelar</button>
                <button id="modal-btn-confirm" class="btn-danger">Quitar</button>
            </div>
        </div>
    </div>

    <script src="/static/js/favoritos.js"></script>
</body>

</html>
